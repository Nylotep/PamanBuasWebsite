<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Single Page Game Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MAIN MENU -->
    <main class="game-screen" id="main">
        <h1 class="game-title">Mist or east</h1>
        <nav class="menu-list">
            <ul>
                <!-- Clicking these updates the URL to end in #options or #load -->
                <li><a href="#Start">Start</a></li>
                <li><a href="#Options">Options</a></li>
                <li><a href="#LearnMore">Learn More</a></li>
            </ul>
        </nav>
    </main>


    <!-- START -->
    <main class="game-screen" id="Start">
        <h1 class="game-title">MISTUH bis</h1>
        <nav class="menu-list">
            <ul>
                <li><a href="#">Save 1: The Dark Forest</a></li>
                <li><a href="#">Save 2: Castle Ruins</a></li>
                <li><a href="#main">Back to Menu</a></li>
            </ul>
        </nav>
    </main>


    <!-- OPTIONS MENU -->
    <main class="game-screen" id="Options">
        <h1 class="game-title">OPTIONS</h1>
        <nav class="menu-list">
            <ul>
                <li><a href="#">Audio: 100%</a></li>
                <li><a href="#">Graphics: Ultra</a></li>
                <!-- Pointing href to #main returns the user to the first screen -->
                <li><a href="#main">Back to Menu</a></li>
            </ul>
        </nav>
    </main>

    <!-- LEARN MORE -->
     <main class="game-screen" id="LearnMore">
        <h1 class="game-title">About Us</h1>
        <nav class="menu-list">
            <ul>
                <li><a href="#">awdawd</a></li>
                <li><a href="#main">Back to Menu</a></li>
            </ul>
        </nav>
     </main>

</body>
</html>
